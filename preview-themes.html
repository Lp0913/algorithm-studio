<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>志通达 · 五风格对照</title>
<style>
  :root { color-scheme: dark; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: #e8edf2; }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 18px 22px 14px;
    background: #0b0d10f2; border-bottom: 1px solid #243041;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 700; }
  p { margin: 6px 0 0; color: #8b97a6; font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(280px, 1fr));
    gap: 12px;
    padding: 12px;
    min-height: calc(100vh - 78px);
  }
  @media (max-width: 1400px) {
    .grid { grid-template-columns: repeat(3, minmax(280px, 1fr)); }
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 70vh;
    border: 1px solid #243041;
    background: #12161c;
  }
  figcaption {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #243041;
    font: 500 12px/1.3 "IBM Plex Mono", monospace;
  }
  figcaption a { color: #6eb6ff; }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #fff;
  }
  .swatch { width: 12px; height: 12px; display: inline-block; margin-right: 8px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>五风格对照预览</h1>
    <p>每格都是完整官网。也可点开单页，用右下角切换器细看。</p>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
const themes = [
  { id: 'azure', name: '01 矿物蓝', color: '#6eb6ff' },
  { id: 'forest', name: '02 松墨绿', color: '#3f9a6b' },
  { id: 'paper', name: '03 纸本编辑', color: '#d0c4b0' },
  { id: 'night', name: '04 夜光信号', color: '#b6f34d' },
  { id: 'brass', name: '05 岩灰铜', color: '#b08a4f' },
];
const grid = document.getElementById('grid');
for (const theme of themes) {
  const figure = document.createElement('figure');
  figure.innerHTML = `
    <figcaption>
      <span><i class="swatch" style="background:${theme.color}"></i>${theme.name}</span>
      <a href="./index.html?theme=${theme.id}" target="_blank" rel="noopener">单页打开</a>
    </figcaption>
    <iframe title="${theme.name}" src="./index.html?theme=${theme.id}&embed=1" loading="eager"></iframe>
  `;
  grid.appendChild(figure);
}
</script>
</body>
</html>
